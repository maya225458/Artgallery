<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Art Gallery | Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

<div class="container">

    <div class="left-content">

        <h1>Art Gallery</h1>

        <p>

            Welcome to the Online Art Gallery.

            Discover famous paintings from talented artists around the world.

            Explore their history, artist information, and similar masterpieces.

        </p>

    </div>

    <div class="login-box">

        <h2>Login</h2>

        <form action="index.html">

            <label>Email</label>

            <input
            type="email"
            class="form-control"
            placeholder="Enter Email">

            <br>

            <label>Password</label>

            <input
            type="password"
            class="form-control"
            placeholder="Enter Password">

            <br>

            <button
            class="btn btn-primary w-100">

            Login

            </button>

        </form>

        <p class="signup-text">

            Don't have an account?

            <a href="signup.html">

            Sign Up

            </a>

        </p>

    </div>

</div>

</body>

</html>
